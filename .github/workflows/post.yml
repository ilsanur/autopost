name: Threads autopost
on:
  schedule:
    - cron: "0 5 * * *"    # 10:00 Атырау (UTC+5) — пост на русском
    - cron: "0 14 * * *"   # 19:00 Атырау — пост на казахском
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать пост, не публиковать"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: autopost
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 post.py ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      - name: Save state
        run: |
          git config user.name "autopost"; git config user.email "autopost@users.noreply.github.com"
          git add state.json && git commit -m "state" && git push || true
