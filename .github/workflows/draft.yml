name: Draft to Telegram
on:
  schedule:
    - cron: "30 4 * * *"    # 09:30 Атырау — черновик на русском
    - cron: "30 13 * * *"   # 18:30 Атырау — черновик на казахском
  workflow_dispatch:
permissions:
  contents: write
concurrency: autopost
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 post.py draft
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name autopost; git config user.email autopost@users.noreply.github.com
          git add state.json && git commit -m state && git push || true
