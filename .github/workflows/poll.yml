name: Check Telegram answers
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: autopost
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 post.py poll
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: |
          git config user.name autopost; git config user.email autopost@users.noreply.github.com
          git add state.json && (git diff --cached --quiet || (git commit -m state && git push))
